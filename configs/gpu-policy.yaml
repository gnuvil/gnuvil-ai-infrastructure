---
services:
  gpu-smoke: job
  comfyui:
    mode: service
    ready_url: http://127.0.0.1:8188/system_stats
    probe_socket: /run/gnuvil-comfyui/lifecycle.sock
    # Image AI Studio (CPU-only UI) starts and stops together with ComfyUI
    companions: [studio]
  llamacpp:
    mode: service
    ready_url: http://127.0.0.1:8081/health
    probe_socket: /run/gnuvil-llamacpp/lifecycle.sock
stop_timeout_seconds: 30
idle_timeout_seconds: 30
job_timeout_seconds: 60
idle_memory_mib: 64
ready_timeout_seconds: 120
