---
services:
  portal:
    platform: linux/amd64
    image: gnuvil-ai/portal:0.1.0
    build:
      context: ../..
      dockerfile: services/portal/Dockerfile
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    group_add: ["${PORTAL_SOCKET_GID:-10001}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    ports: ["127.0.0.1:8080:8080"]
    environment:
      PORTAL_CONFIG: /etc/gnuvil-ai/portal.yaml
      PORTAL_SOCKET: /run/gnuvil-ai/controller.sock
      PORTAL_PROXY_TOKEN: ${PORTAL_PROXY_TOKEN:-}
    volumes:
      - type: bind
        source: ../../configs/portal.yaml
        target: /etc/gnuvil-ai/portal.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/gnuvil-ai
        target: /run/gnuvil-ai
        read_only: true
        bind:
          create_host_path: false
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  portal-proxy:
    profiles: [portal-access]
    platform: linux/amd64
    image: nginx:stable-alpine@sha256:8eb04fe3b385090e9aa02961f77398ad09b6bf33ab07f6669a5bb7acce22c0d3
    pull_policy: never
    restart: unless-stopped
    user: "10001:10001"
    entrypoint: [nginx]
    command: [-g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.5
    ports: ["${PORTAL_BIND_IP:-127.0.0.1}:443:8443"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/gnuvil-ai/proxy-token.conf:/etc/nginx/portal-token.conf:ro
      - /etc/gnuvil-ai/portal.htpasswd:/etc/nginx/portal.htpasswd:ro
      - /etc/gnuvil-ai/portal.crt:/etc/nginx/portal.crt:ro
      - /etc/gnuvil-ai/portal.key:/etc/nginx/portal.key:ro
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    depends_on:
      portal:
        condition: service_healthy
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 30s
      timeout: 3s
      retries: 3
