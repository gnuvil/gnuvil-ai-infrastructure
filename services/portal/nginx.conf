worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1k;
    client_body_timeout 10s;
    keepalive_timeout 30s;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:1m;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/portal.crt;
        ssl_certificate_key /etc/nginx/portal.key;
        auth_basic "Gnuvil AI Lab";
        auth_basic_user_file /etc/nginx/portal.htpasswd;
        location / {
            include /etc/nginx/portal-token.conf;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_pass http://portal:8080;
        }
    }
}
