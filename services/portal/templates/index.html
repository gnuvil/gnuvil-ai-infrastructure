<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"includeIndicatorStyles":false}'>
  <title>{{ settings.title }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#services">서비스 목록으로 이동</a>
  <div class="shell">
    <header class="header">
      <a class="brand" href="/" aria-label="{{ settings.title }} 홈">
        <span class="brand-logo"><img src="/static/gnuvil-logo.png" alt="그누빌 동아리 로고" width="126" height="126"></span>
        <strong>{{ settings.title }}</strong>
      </a>
      <button type="button" class="theme-button" id="theme-toggle" aria-label="화면 테마 전환">시스템 테마</button>
    </header>
    <main>
      <h1 class="page-title">대시보드</h1>
      {% include 'dashboard.html' %}
    </main>
  </div>
</body>
</html>
