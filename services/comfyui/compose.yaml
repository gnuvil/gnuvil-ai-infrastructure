---
services:
  comfyui:
    platform: linux/amd64
    image: gnuvil-ai/comfyui:0d0e105-cu126
    build:
      context: .
    profiles: [comfyui]
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HOME: /data/user
    ports:
      - "127.0.0.1:8188:8188"
      - "192.168.50.14:8188:8188"
    volumes:
      - ./entrypoint.sh:/usr/local/bin/gnuvil-comfyui:ro
      - ./gnuvil_lifecycle:/opt/ComfyUI/custom_nodes/gnuvil_lifecycle:ro
      - type: bind
        source: /run/gnuvil-comfyui
        target: /run/gnuvil-comfyui
        bind:
          create_host_path: false
      - /srv/ai-data/models/comfyui/checkpoints:/opt/ComfyUI/models/checkpoints:ro
      - /srv/ai-data/outputs/comfyui:/data/output
      - /srv/ai-data/state/comfyui/input:/data/input
      - /srv/ai-data/state/comfyui/user:/data/user
    pull_policy: never
    restart: "no"
    stop_signal: SIGINT
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 180s
