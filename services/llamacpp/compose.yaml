---
services:
  llamacpp:
    platform: linux/amd64
    image: gnuvil-ai/llamacpp:d12cc3d-cu129-router1
    build:
      context: .
    profiles: [llamacpp]
    gpus: all
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command: ["--models-dir", "/models", "--models-preset", "/etc/llamacpp/models.ini", "--models-max", "1", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - type: bind
        source: /srv/ai-data/models/llamacpp
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./models.ini
        target: /etc/llamacpp/models.ini
        read_only: true
        bind:
          create_host_path: false
    pull_policy: never
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "2", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 180s
